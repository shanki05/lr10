<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гра «Однорукий бандит»</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }

        .container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 2rem;
            color: #333;
        }

        h2 {
            margin: 0 0 20px 0;
            font-size: 1.2rem;
            font-style: italic;
            color: #555;
            font-weight: normal;
        }

        #generateBtn {
            background-color: #00ff00;
            color: black;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            padding: 15px 30px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 20px;
            transition: transform 0.1s, filter 0.2s;
        }

        #generateBtn:hover:not(:disabled) {
            filter: brightness(0.9);
        }

        #generateBtn:active:not(:disabled) {
            transform: scale(0.95);
        }

        #generateBtn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .slot-machine {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            background-color: #333;
            padding: 10px;
            border: 4px solid #555;
            border-radius: 5px;
        }

        .cell {
            background-color: #7b88bd;
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4rem;
            border: 2px solid #222;
            transition: all 0.3s ease;
        }

        .spin {
            animation: spinAnim 0.3s ease-in-out;
            filter: blur(2px);
        }

        @keyframes spinAnim {
            0% { transform: translateY(-20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .win-highlight {
            background-color: #ffd700;
            box-shadow: 0 0 15px #ffd700;
            transform: scale(1.05);
            z-index: 10;
        }

        #resultMessage {
            margin-top: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            min-height: 30px;
        }

        .success { color: #28a745; }
        .danger { color: #dc3545; }

        #restartBtn {
            display: none;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }

        @media (max-width: 350px) {
            .cell { font-size: 3rem; }
            #generateBtn { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="userNameDisplay">User</h1>
        <h2 id="attemptDisplay">Спроба 0 з 3</h2>
        
        <button id="generateBtn">Generate</button>
        
        <div class="slot-machine" id="slotMachine">
            <div class="cell" id="cell-0-0"></div>
            <div class="cell" id="cell-0-1"></div>
            <div class="cell" id="cell-0-2"></div>
            <div class="cell" id="cell-1-0"></div>
            <div class="cell" id="cell-1-1"></div>
            <div class="cell" id="cell-1-2"></div>
            <div class="cell" id="cell-2-0"></div>
            <div class="cell" id="cell-2-1"></div>
            <div class="cell" id="cell-2-2"></div>
        </div>

        <div id="resultMessage"></div>
        <button id="restartBtn">Грати знову</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
